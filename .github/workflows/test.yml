name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: churn-evidence --input examples/acme_exports --output /tmp/churn-demo --as-of 2026-09-17T00:00:00+00:00
